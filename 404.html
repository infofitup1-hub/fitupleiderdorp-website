<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Pagina niet gevonden — Fit Up Leiderdorp</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--black:#0c0c0c;--white:#fff;--accent:#d4ff00;--gray:#888;--fd:'Barlow Condensed',sans-serif;--fb:'DM Sans',sans-serif}
  body{background:var(--black);color:var(--white);font-family:var(--fb);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
  .wrap{max-width:600px;text-align:center}
  .code{font-family:var(--fd);font-weight:900;font-size:clamp(120px,22vw,220px);line-height:.85;color:var(--accent);letter-spacing:-2px}
  h1{font-family:var(--fd);font-weight:900;text-transform:uppercase;font-size:clamp(36px,6vw,60px);line-height:1;margin:8px 0 20px;letter-spacing:-0.5px}
  p{color:rgba(255,255,255,.65);font-size:17px;line-height:1.6;margin-bottom:36px;max-width:480px;margin-left:auto;margin-right:auto}
  .ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  a{text-decoration:none;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;font-family:var(--fd);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:14px;transition:all .2s}
  .btn-accent{background:var(--accent);color:var(--black)}
  .btn-accent:hover{background:#e5ff4d}
  .btn-ghost{color:var(--white);border:1px solid rgba(255,255,255,.2)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
</style>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Pagina niet gevonden</h1>
  <p>Deze pagina bestaat niet (meer). Geen probleem — keer terug naar de homepage of bekijk ons trainingsaanbod.</p>
  <div class="ctas">
    <a class="btn-accent" href="index.html">Terug naar home →</a>
    <a class="btn-ghost" href="contact/index.html">Contact opnemen</a>
  </div>
</div>
</body>
</html>
