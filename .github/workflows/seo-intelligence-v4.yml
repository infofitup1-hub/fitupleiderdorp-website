name: AutoSEO v4 - Google Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"

permissions:
  contents: read
  id-token: write

jobs:
  google-intelligence:
    name: "SEO v4 - GSC + GA4 + Technical Intelligence"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: fitup-seo-intelligence
          workload_identity_provider: projects/669780333216/locations/global/workloadIdentityPools/github-autoseo/providers/github-actions
          service_account: autoseo-v4@fitup-seo-intelligence.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/webmasters.readonly
            https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify Google identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.auth.outputs.access_token }}"
          echo "Google Workload Identity Federation authentication succeeded."

      - name: Verify Search Console API access
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -sS -o /tmp/gsc.json -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/webmasters/v3/sites")

          cat /tmp/gsc.json

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Search Console API failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          grep -q "fitupleiderdorp.nl" /tmp/gsc.json || {
            echo "Search Console API works, but fitupleiderdorp.nl was not found."
            exit 1
          }

          echo "Search Console access verified."

      - name: Verify GA4 Data API access
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GA4_PROPERTY_ID: "540487028"
        run: |
          set -euo pipefail

          cat >/tmp/ga4-request.json <<'JSON'
          {
            "dateRanges": [
              {
                "startDate": "7daysAgo",
                "endDate": "yesterday"
              }
            ],
            "metrics": [
              {
                "name": "sessions"
              }
            ],
            "limit": "1"
          }
          JSON

          HTTP_CODE=$(curl -sS -o /tmp/ga4.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/ga4-request.json \
            "https://analyticsdata.googleapis.com/v1beta/properties/${GA4_PROPERTY_ID}:runReport")

          cat /tmp/ga4.json

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "GA4 Data API failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "GA4 Data API access verified for property ${GA4_PROPERTY_ID}."

      - name: Self-test intelligence engine
        run: |
          node --check .github/autoseo-v4-intelligence.mjs
          node --check .github/autoseo-v4-technical.mjs
          node .github/autoseo-v4-intelligence.mjs --self-test
          node --test .github/autoseo-v4-technical.test.mjs

      - name: Build SEO/GEO intelligence input and opportunities
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GSC_SITE_URL: "https://fitupleiderdorp.nl/"
          GA4_PROPERTY_ID: "540487028"
          AUTOSEO_OUTPUT_DIR: "artifacts/autoseo-v4"
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          AUTOSEO_TECHNICAL_MAX_URLS: "5"
          AUTOSEO_FETCH_TIMEOUT_MS: "15000"
          AUTOSEO_IMPORTANT_URLS: "/personal-training-leiderdorp/,/tarieven/"
          # Reserved hooks only: setting these never activates a paid provider.
          AUTOSEO_RANKING_PROVIDER: ${{ vars.AUTOSEO_RANKING_PROVIDER }}
          AUTOSEO_RANKING_API_KEY: ${{ secrets.AUTOSEO_RANKING_API_KEY }}
          AUTOSEO_BACKLINK_PROVIDER: ${{ vars.AUTOSEO_BACKLINK_PROVIDER }}
          AUTOSEO_BACKLINK_API_KEY: ${{ secrets.AUTOSEO_BACKLINK_API_KEY }}
        run: node .github/autoseo-v4-intelligence.mjs

      - name: Add intelligence summary to workflow
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/autoseo-v4/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AutoSEO v4 intelligence artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoseo-v4-intelligence
          path: artifacts/autoseo-v4/
          if-no-files-found: error
          retention-days: 30

      - name: AutoSEO v4 summary
        if: success()
        run: |
          echo "AutoSEO v4 intelligence run succeeded."
          echo "Search Console and GA4 data were combined into structured SEO/GEO input."
          echo "Prioritized opportunities were generated and saved as a workflow artifact."
          echo "Technical SEO and PageSpeed actions are separate; provider hooks make no paid API calls."
