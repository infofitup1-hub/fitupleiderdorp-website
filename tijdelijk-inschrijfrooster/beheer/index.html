<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BuddyCheck beheer | Fit Up</title><style>body{background:#080a09;color:white;font:16px/1.5 system-ui;margin:30px auto;max-width:660px;padding:0 16px}h1{color:#b7f229}input{width:100%;padding:12px;background:#1b211c;color:white;border:1px solid #697363;box-sizing:border-box}button{background:#b7f229;border:0;border-radius:6px;padding:10px 13px;font-weight:700;cursor:pointer;margin:4px}article{padding:15px;border:1px solid #444;margin:12px 0;border-radius:8px}p{color:#ccc}</style></head><body><h1>BuddyCheck – Beheer aanvragen</h1><p>Alleen toegankelijk voor Fit Up-beheerders. Voer het afzonderlijke, geheime beheertoken in.</p><label>Beheertoken <input id="token" type="password" autocomplete="off"></label><button id="load">Aanvragen ophalen</button><p id="info" role="status"></p><section id="items"></section><script>
const endpoint='/.netlify/functions/buddycheck-requests', $=id=>document.getElementById(id);
async function request(body){const r=await fetch(endpoint+(body?'':'?mode=admin'),{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok||data.ok===false)throw Error(data.message||'Niet gelukt');return data}
$('load').onclick=async()=>{const parent=$('items');parent.replaceChildren();try{const rows=await request();for(const r of rows){const card=document.createElement('article');const title=document.createElement('strong');title.textContent=r.lesson+' · '+r.date+' · '+r.start;card.append(title);const p=document.createElement('p');p.textContent=r.name+' · '+r.email+' · '+r.status;card.append(p);if(r.status==='pending'){for(const [decision,label] of [['approved','Goedkeuren'],['rejected','Afwijzen']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{const d=await request({action:'decide',requestId:r.id,decision});$('info').textContent=d.message;$('load').click()}catch(e){$('info').textContent=e.message;b.disabled=false}};card.append(b)}}parent.append(card)}$('info').textContent=rows.length+' aanvragen geladen.'}catch(e){$('info').textContent=e.message}};
</script></body></html>
